# Local MySQL for development. Zero cost, no cloud account needed.
#   docker compose up -d
#   mysql -h 127.0.0.1 -P 3307 -u ufms -pufms ufms < ufms_schema.sql
#
# Host port is 3307, not 3306: a native MySQL install commonly already owns
# 3306 on Windows. Override with MYSQL_HOST_PORT if 3307 is taken too.
#
# The container NAME is overridable too, with MYSQL_CONTAINER_NAME. Without that,
# `docker compose up -d` from a second checkout fails with "the container name
# /ufms-mysql is already in use" - and exits 0 while doing it. If you override it,
# use the same name in the `docker exec` commands in the docs.
services:
  db:
    image: mysql:8.0
    container_name: ${MYSQL_CONTAINER_NAME:-ufms-mysql}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ufms
      MYSQL_USER: ufms
      MYSQL_PASSWORD: ufms
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - ufms_mysql_data:/var/lib/mysql
      # Runs once, on first init of the volume. Grants the ufms user rights over
      # `ufms_t_%` so tests/test_migrations.py can build its throwaway databases
      # instead of skipping. See the file for why that matters.
      - ./scripts/mysql-init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ufms_mysql_data:
